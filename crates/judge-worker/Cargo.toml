[package]
name = "judge-worker"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "judge-worker"
path = "src/main.rs"

[features]
default = []
linux-seccomp = ["dep:seccompiler"]

[dependencies]
judge-core = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
libc = "0.2"
nix = { version = "0.29", features = ["sched", "resource", "mount", "process"] }
tree-sitter = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-python = "0.23"
tree-sitter-java = "0.23"
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "aio"] }
sqlx = { workspace = true }
judge-db = { path = "../judge-db" }

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = { version = "0.4", optional = true }
