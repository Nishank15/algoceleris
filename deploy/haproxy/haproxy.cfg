# ==============================================================================
# Cloud-Judge V2 - Production HAProxy Layer 7 Configuration
# High-Availability Ingress, WebSocket Tunneling, and Gateway Load Balancing
# ==============================================================================

global
    log stdout format raw local0 info
    maxconn 4096
    stats socket /tmp/haproxy.sock mode 660 level admin expose-fd listeners
    stats timeout 30s

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    retries 3
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    timeout tunnel  3600000ms  # 1 hour WebSocket execution stream keepalive

# ------------------------------------------------------------------------------
# Frontend: Public HTTP & WebSocket Ingress
# ------------------------------------------------------------------------------
frontend ingress_http
    bind 0.0.0.0:80
    bind 0.0.0.0:8080

    # Client IP forwarding headers
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Port %[dst_port]

    # WebSocket Protocol Inspection ACLs
    acl is_websocket hdr(Upgrade) -i WebSocket
    acl is_websocket_hdr hdr_beg(Host) -i ws
    acl is_ws_path path_beg /ws/

    # Route WebSocket streams to dedicated tunnel backend with extended keepalive
    use_backend gateway_ws_cluster if is_websocket or is_ws_path

    # Default: Route REST API, contest, and judge endpoints to round-robin cluster
    default_backend gateway_api_cluster

# ------------------------------------------------------------------------------
# Backend: Stateless Gateway REST API Cluster (Round-Robin)
# ------------------------------------------------------------------------------
backend gateway_api_cluster
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200

    default-server inter 2s fall 3 rise 2 maxconn 1024

    server gateway_1 gateway_1:8000 check
    server gateway_2 gateway_2:8000 check

# ------------------------------------------------------------------------------
# Backend: Real-time WebSocket Streaming Cluster (Least Connections)
# ------------------------------------------------------------------------------
backend gateway_ws_cluster
    mode http
    balance leastconn
    timeout tunnel 3600000ms  # Explicit 1h tunnel timeout for long contest streams
    option httpchk GET /health
    http-check expect status 200

    default-server inter 2s fall 3 rise 2 maxconn 2048

    server gateway_1 gateway_1:8000 check
    server gateway_2 gateway_2:8000 check

# ------------------------------------------------------------------------------
# Administration & Live Telemetry Metrics
# ------------------------------------------------------------------------------
listen stats
    bind 0.0.0.0:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-node
    stats show-legends
    stats admin if TRUE
