# ==============================================================================
# Cloud-Judge V2 - Production HAProxy Layer 7 Configuration
# Strangler-Fig Migration: Rust Axum Gateway Pool & Legacy FastAPI Fallback
# ==============================================================================

global
    log stdout format raw local0 info
    maxconn 4096
    stats socket /tmp/haproxy.sock mode 660 level admin expose-fd listeners
    stats timeout 30s

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    retries 3
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    timeout tunnel  3600000ms  # 1 hour WebSocket execution stream keepalive

# ------------------------------------------------------------------------------
# Frontend: Public HTTP & WebSocket Ingress
# ------------------------------------------------------------------------------
frontend http_in
    bind 0.0.0.0:80
    bind 0.0.0.0:8080

    # Client IP forwarding headers
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Port %[dst_port]

    # WebSocket Protocol Inspection ACL
    acl is_websocket hdr(Upgrade) -i WebSocket

    # Comprehensive API and WebSocket Path ACLs
    acl is_api path_beg /api/v1/
    acl is_ws path_beg /ws/
    acl is_health path /health

    # WebSocket protocol switching to Rust backend
    use_backend rust_gateway_pool if is_websocket

    # Route all API, WebSocket, and Health endpoints directly to Rust gateway pool
    use_backend rust_gateway_pool if is_api or is_ws or is_health

    # Tag outgoing response with backend pool for observability & cutover verification
    http-response set-header X-Backend-Pool %b

    # Default: Route all traffic to Rust gateway pool (zero legacy Python dependency)
    default_backend rust_gateway_pool

# ------------------------------------------------------------------------------
# Backend: Rust Axum Gateway Cluster (Strangler-Fig Modernized Pool)
# ------------------------------------------------------------------------------
backend rust_gateway_pool
    mode http
    balance roundrobin
    timeout tunnel 3600000ms
    option httpchk GET /health
    http-check expect status 200

    http-response set-header X-Served-By rust-axum

    default-server inter 2s fall 3 rise 2 maxconn 2048

    server rust_gateway_1 127.0.0.1:9000 check
    server rust_gateway_2 127.0.0.1:9001 check

# ------------------------------------------------------------------------------
# Backend: Legacy FastAPI Cluster (Fallback Pool)
# ------------------------------------------------------------------------------
backend legacy_python_pool
    mode http
    balance roundrobin
    timeout tunnel 3600000ms
    option httpchk GET /health
    http-check expect status 200

    http-response set-header X-Served-By legacy-fastapi

    default-server inter 2s fall 3 rise 2 maxconn 1024

    server legacy_1 127.0.0.1:8000 check
    server legacy_2 127.0.0.1:8001 check

# ------------------------------------------------------------------------------
# Administration & Live Telemetry Metrics
# ------------------------------------------------------------------------------
listen stats
    bind 0.0.0.0:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-node
    stats show-legends
    stats admin if TRUE
