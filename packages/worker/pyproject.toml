[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudjudge-worker"
version = "0.1.0"
description = "Asynchronous execution worker daemon for Cloud-Judge V2"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "redis>=4.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
